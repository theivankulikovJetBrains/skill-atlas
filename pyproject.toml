[project]
name = "skill-atlas"
version = "0.1.0"
description = "Scan a git repository and find all AI agent skills."
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
skill-atlas = "skill_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_atlas"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A blocking test prints nothing at all, and CI just stops until the job times out.
# This dumps every thread's stack and names the test instead. Belt to the no_server_loop
# braces in conftest: that fixture stops the one known way in, this catches the next one.
# The suite runs in seconds, so a minute only elapses on a real hang.
faulthandler_timeout = 60
