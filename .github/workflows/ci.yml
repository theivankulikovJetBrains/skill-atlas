name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  # The same suite again, on one OS, with a browser photographing the report at every
  # check made against it. Separate from `test` on purpose: that job is three OSes of
  # markup assertions that finish in seconds, and collection needs a browser and about
  # a minute. A red check fails this job exactly as it fails that one -- the artifact is
  # evidence, not a substitute for the verdict. See tests/shots.py.
  screenshots:
    name: report screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      - name: Run the suite and photograph every report check
        env:
          # Through the environment rather than --shots-dir: pytest cannot know that flag
          # takes a value until a conftest has loaded, so a value that happens to be an
          # existing directory is read as a test path instead -- which moves rootdir and
          # then loads no conftest at all. RUNNER_TEMP is outside the checkout, so nothing
          # collected here can reach `git status`.
          SKILL_ATLAS_SHOTS_DIR: ${{ runner.temp }}/shots
          # Microsoft Edge ships with the runner image, so a browser that cannot be found
          # or cannot render is a broken job rather than a machine that could not oblige.
          # Without this the capture would skip itself and the upload below would succeed
          # with an empty directory, under a green tick.
          SKILL_ATLAS_SHOTS_STRICT: "1"
        run: uv run pytest

      # always(): a red check is the one case where these pictures are worth looking at,
      # and the frame that failed is the last one collected. if-no-files-found is left at
      # its default warning -- the run is already failed by the step above when nothing
      # was photographed, and erroring here too would only bury that.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-screenshots
          path: ${{ runner.temp }}/shots

  # The demo-video skill, run in CI, and its GIF posted onto the pull request so a reviewer
  # sees the app working without checking the branch out. Like `screenshots` this is a check
  # that happens to produce a picture: the recorder exits non-zero when any scenario is red,
  # which fails this job, and the comment then names the red ones rather than quietly showing
  # a film of a broken app.
  demo:
    name: demo gif
    runs-on: ubuntu-latest
    # A fork's `pull_request` token is read-only and gets no secrets, so both the push to the
    # asset branch and the comment would 403. Skipping leaves a fork's pull request green with
    # the artifact below instead of a red check nobody on that side can fix; a maintainer who
    # wants the film can still get it from workflow_dispatch on the branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write        # pushes the GIF to the asset branch
      pull-requests: write   # posts, or updates, the one comment
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked

      # --offline on purpose. The one over-the-network scenario clones a public repository
      # whose contents can change under the run, and this job posts to the pull request on
      # every push, so a flake here is a wrong comment rather than a retryable red tick.
      # The skill's own docs call --offline green rather than degraded: the report steps fall
      # back to the `atlas` fixture and only that single scan is dropped.
      #
      # python3, not python: the runner image has no unversioned alias. Edge comes with the
      # image, which is why record_demo.py finds it at /usr/bin/microsoft-edge -- and why it
      # passes --no-sandbox there, as tests/shots.py does, or it would write no frames at all.
      - name: Record every scenario as a GIF
        run: python3 .claude/skills/demo-video/scripts/record_demo.py --gif --offline

      # always(): a red run is the one where the film and the transcript are worth reading,
      # and it is also the case the comment below leads with. The artifact is what a fork's
      # pull request gets instead of a comment.
      - name: Upload the GIF and the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: |
            demo-run/demo.gif
            demo-run/transcript.md
            demo-run/summary.json

      - name: Publish it onto the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GIF: demo-run/demo.gif
          SUMMARY: demo-run/summary.json
          PR: ${{ github.event.pull_request.number }}
          # head.sha, not github.sha: on a pull_request event the latter is the ephemeral
          # merge commit, which is no use as a cache-busting key a reviewer can recognise.
          SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          BRANCH: demo-assets
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-demo-gif.sh

  package:
    name: package and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      # Scanning the checkout itself keeps this offline, and exercises the
      # installed wheel rather than the source tree -- the one place a data
      # file missing from the package (the report template) shows up.
      # The report goes to a fresh path guarded by `test ! -e`: writing to a
      # path that already holds a report would let the assertions below pass
      # against the pre-existing copy even if this scan produced nothing.
      - name: Scan this repository through the built wheel
        run: |
          out="$RUNNER_TEMP/smoke/report.html"
          test ! -e "$out"
          uv run --isolated --no-project --python 3.14 --with dist/*.whl \
            skill-atlas scan "file://$PWD" -o "$out" --no-open
          grep -q "<title>Skill Atlas" "$out"
          grep -q "$(git rev-parse --short=12 HEAD)" "$out"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: ${{ runner.temp }}/smoke/report.html
